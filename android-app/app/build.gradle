plugins {
    id 'com.android.application'
}

def keystorePropsFile = rootProject.file('key.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

def releaseRepoProp = project.findProperty('RELEASE_REPO') ?: 'Ayan-Paul-2001/CineVault-Public-Release'

android {
    namespace 'com.cinevault.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.cinevault.app'
        minSdk 24
        targetSdk 35
        versionCode 4
        versionName '1.1.2'

        buildConfigField 'String', 'RELEASE_REPO', "\"${releaseRepoProp}\""
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    signingConfigs {
        if (keystorePropsFile.exists()) {
            release {
                storeFile rootProject.file(keystoreProps.getProperty('storeFile'))
                storePassword keystoreProps.getProperty('storePassword')
                keyAlias keystoreProps.getProperty('keyAlias')
                keyPassword keystoreProps.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            signingConfig keystorePropsFile.exists() ? signingConfigs.release : signingConfigs.debug
            debuggable false
            minifyEnabled false
            shrinkResources false
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.core:core:1.15.0'

    // Native AndroidX Media3 ExoPlayer + OkHttp datasource + FFmpeg audio decoder (AC3/EAC3/DTS/TrueHD/FLAC)
    implementation 'androidx.media3:media3-exoplayer:1.5.0'
    implementation 'androidx.media3:media3-ui:1.5.0'
    implementation 'androidx.media3:media3-datasource-okhttp:1.5.0'
    implementation 'org.jellyfin.media3:media3-ffmpeg-decoder:1.5.0+1'

    // Fast HTTP networking and poster caching
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
